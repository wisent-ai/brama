[package]
name = "brama"
version = "0.5.0"
edition = "2021"
license-file = "LICENSE"
autotests = false

[[bin]]
name = "brama"
path = "src/main.rs"

[lib]
name = "brama"
path = "src/lib.rs"

[[test]]
name = "subscription-capacity"
path = "tests/subscriptions/capacity.rs"

[[test]]
name = "workload-authority"
path = "tests/authentication/authority.rs"

[[test]]
name = "subscription-overlay"
path = "tests/subscriptions/overlay.rs"

[[test]]
name = "readiness-inventory"
path = "tests/readiness/inventory.rs"

[[test]]
name = "readiness-standing"
path = "tests/readiness/standing.rs"

[[test]]
name = "credential-administration"
path = "tests/administration/credential-refusal.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
thiserror = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"
uuid = { version = "1", features = ["serde", "v4"] }
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "8947ad21ac852750b118b417f9dfe68f144ad295" }
wisent-onboarding-client = { git = "https://github.com/wisent-ai/echo-web", rev = "22437b2e8c29291f3db6c4d605d20e7db3bdb2e1", package = "wisent-onboarding-client" }
stado-wait = { git = "https://github.com/wisent-ai/stado", package = "stado-wait" }

ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
libc = "0.2"
zeroize = { version = "1.8", features = ["serde"] }
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }

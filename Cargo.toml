[package]
name = "brama"
version = "0.2.3"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "brama"
path = "src/main.rs"

[lib]
name = "brama"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
thiserror = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"
uuid = { version = "1", features = ["serde", "v4"] }
wisent-onboarding-client = { git = "https://github.com/wisent-ai/echo-web", rev = "aa423766991c3c958145bc7e5f2a62748bb3951c", package = "wisent-onboarding-client" }

ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
libc = "0.2"
zeroize = "1.8"
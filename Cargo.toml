[package]
name = "model_router"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "model-router"
path = "src/main.rs"

[lib]
name = "model_router"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
thiserror = "1"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
postgrest = "1.6"
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"
tempfile = "3.10"

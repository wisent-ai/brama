[package]
name = "model_router"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "model-router"
path = "src/main.rs"

[lib]
name = "model_router"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
thiserror = "1"

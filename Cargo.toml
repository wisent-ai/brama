[package]
name = "brama"
version = "0.2.65"
edition = "2021"
license-file = "LICENSE"

[[bin]]
name = "brama"
path = "src/main.rs"

[lib]
name = "brama"
path = "src/lib.rs"

[[test]]
name = "cli_command_contracts"
path = "tests/cli/command_contracts.rs"

[[test]]
name = "admin_real"
path = "tests/providers/admin_real.rs"

[[test]]
name = "subscription_real"
path = "tests/providers/subscription_real.rs"

[[test]]
name = "capability_real"
path = "tests/providers/capability_real.rs"

[[test]]
name = "http_api_real"
path = "tests/providers/http_api_real.rs"

[[test]]
name = "provider_contracts"
path = "tests/providers/provider_contracts.rs"

[[test]]
name = "refusal_contract"
path = "tests/routing/refusal_contract.rs"

[[test]]
name = "subscription_tag_contract"
path = "tests/routing/subscription_tag_contract.rs"

[[test]]
name = "discovery_reason_contract"
path = "tests/routing/discovery_reason_contract.rs"


[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.30"
thiserror = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"
uuid = { version = "1", features = ["serde", "v4"] }
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "e3014d2c900e499e171aeed8804da10bc7d93bf8" }
wisent-onboarding-client = { git = "https://github.com/wisent-ai/echo-web", rev = "aa423766991c3c958145bc7e5f2a62748bb3951c", package = "wisent-onboarding-client" }

ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
libc = "0.2"
zeroize = "1.8"
[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }

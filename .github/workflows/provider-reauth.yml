name: provider-reauth

# Brama's codex, claude-code and kimi subscription pools burn out when a
# provider refresh token dies, and each has a checked-in reauth runner in the
# weles repository designed to run hourly on charless-mac-mini
# (scripts/worker/deploy/<provider>-reauth/reauth-launch.sh). Their launchd
# scheduling is gone from the mini, so the pools stayed burnt behind a
# healthy-looking beacon until Jeden failed with
# subscription_reauthorization_required. This workflow restores the tick: the
# stado-release runner is the mini itself, and it executes the same launchers
# from the host's own managed weles checkout on an hourly schedule.
#
# Every runner is self-guarding: it probes its pool first, exits 0 when
# healthy, never triggers a fresh browser login on a quota-burnt tick, and only
# donates or logs in through the credentials its own Skarbiec items describe. A
# green run therefore costs nothing, and a red one names the pool that needs an
# operator.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated subset of pools to run (default: all)"
        required: false
        default: "codex,claude,kimi"

permissions:
  contents: read

concurrency:
  group: provider-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude, kimi]
    steps:
      - name: Skip providers not requested in this dispatch
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              !contains(format(',{0},', github.event.inputs.providers),
                        format(',{0},', matrix.provider)) }}
        run: echo "skipped=1" >> "$GITHUB_ENV"
      # The host's ~/weles is a deployed copy without .git, so it cannot be
      # advanced here — and the auto-deploy unit that kept it current is gone.
      # Run the pinned main revision instead, the same way release-control.yml
      # already clones a second private repository on this runner: vault-backed
      # login material (weles@06135cc6) is exactly what a burnt pool needs, and
      # a pinned checkout never drifts behind the store it must reach.
      - name: Check out the weles runners at main
        if: env.skipped != '1'
        uses: actions/checkout@v4
        with:
          repository: wisent-ai/weles
          path: weles-source
      - name: Put Homebrew on PATH
        if: env.skipped != '1'
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      # `dist/` is a build output: weles gitignores it and tracks no file under
      # it, so a fresh checkout carries none and every launcher dies on
      # ERR_MODULE_NOT_FOUND for dist/utils/login-accounts.js before it can
      # probe its pool -- the pools then stay burnt behind a green-looking
      # schedule. The host's old ~/weles copy was deployed already built, which
      # is why pointing WELES_DIR at a source checkout lost the artefact without
      # anything saying so. node_modules is needed at run time too, not only to
      # compile, and `npm ci` installs exactly the lockfile, so what runs is
      # reproducible against whatever revision the checkout resolved.
      - name: Build the weles runners this job executes
        if: env.skipped != '1'
        working-directory: weles-source
        run: |
          npm ci
          npm run build
      - name: Run the ${{ matrix.provider }} reauth launcher
        if: env.skipped != '1'
        env:
          WELES_DIR: ${{ github.workspace }}/weles-source
          REAUTH_ENTRY: ${{ github.workspace }}/weles-source/scripts/trajectories/${{ matrix.provider }}/reauth.mjs
        run: bash "weles-source/scripts/worker/deploy/${{ matrix.provider }}-reauth/reauth-launch.sh"

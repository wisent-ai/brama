name: provider-reauth

# The self-hosted release runner is the Brama host. Each hourly pass asks the
# installed product to refresh one subscription pool first and starts the real
# Weles sign-in only when that proof fails. Healthy and quota-exhausted pools
# therefore do not open a browser.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated subset of pools to run (default: all)"
        required: false
        default: "codex,claude-code,kimi"

permissions:
  contents: read

concurrency:
  group: provider-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude-code, kimi]
    steps:
      - name: Skip providers not requested in this dispatch
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              !contains(format(',{0},', github.event.inputs.providers),
                        format(',{0},', matrix.provider)) }}
        run: echo "skipped=1" >> "$GITHUB_ENV"
      - name: Refresh or sign in the ${{ matrix.provider }} subscription
        if: env.skipped != '1'
        run: |
          set -eu
          launcher=
          for candidate in \
            "$HOME/.stado/services/brama/current/darwin-arm64/bin/start-with-skarbiec" \
            "$HOME/.stado/services/brama/current/darwin-arm/bin/start-with-skarbiec"
          do
            if [ -x "$candidate" ]; then
              launcher=$candidate
              break
            fi
          done
          test -n "$launcher" || {
            printf '%s\n' 'the installed Brama runtime launcher is unavailable' >&2
            exit 69
          }
          reason="hourly provider credential renewal from GitHub Actions run $GITHUB_RUN_ID"
          if "$launcher" subscription refresh "${{ matrix.provider }}" --reason "$reason" --json; then
            printf '%s\n' "${{ matrix.provider }} subscription refreshed without a sign-in"
            exit 0
          fi
          "$launcher" subscription sign-in "${{ matrix.provider }}" \
            --reason "$reason; refresh required a real sign-in" --json

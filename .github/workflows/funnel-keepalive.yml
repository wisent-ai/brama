name: funnel-keepalive

# Brama's public endpoint is the host's Tailscale Funnel, whose root handler
# must follow Brama's Stado service-directory endpoint. This workflow runs the
# sole maintained publisher on the mini every few minutes. The publisher reads
# the declaration on every pass and changes only path `/`, preserving the
# Stado object and integration paths that share HTTPS port 443.
#
# The runner label is the release-control runner, which is the mini itself:
# the script must run ON the machine whose tailscaled owns the Funnel.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnel-keepalive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 5
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    steps:
      - name: Use job-local Git configuration
        run: |
          git_config=$(mktemp "$RUNNER_TEMP/brama-gitconfig.XXXXXX")
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$git_config" >> "$GITHUB_ENV"
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile Brama's declared Funnel origin
        run: ./scripts/brama-funnel-publisher.sh

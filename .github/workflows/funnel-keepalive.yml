name: funnel-keepalive

# Brama's public endpoint is the host's Tailscale Funnel, whose root handler
# must follow Brama's Stado service-directory endpoint. This workflow runs the
# reconciliation inline on the mini every few minutes, reads
# the declaration on every pass and changes only path `/`, preserving the
# Stado object and integration paths that share HTTPS port 443.
#
# The runner label is the release-control runner, which is the mini itself:
# the reconciliation must run ON the machine whose tailscaled owns the Funnel.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnel-keepalive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 5
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: /usr/bin/false
    steps:
      - name: Use job-local Git configuration
        run: |
          git_config=$(mktemp "$RUNNER_TEMP/brama-gitconfig.XXXXXX")
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$git_config" >> "$GITHUB_ENV"
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile Brama's declared Funnel origin
        run: |
          set -eu
          TAILSCALE=${TAILSCALE_BIN:-$(command -v tailscale || true)}
          if [ -z "$TAILSCALE" ]; then
            for candidate in \
              /Applications/Tailscale.app/Contents/MacOS/Tailscale \
              /Applications/Tailscale.app/Contents/MacOS/tailscale \
              /usr/local/bin/tailscale \
              /opt/homebrew/bin/tailscale
            do
              if [ -x "$candidate" ]; then
                TAILSCALE=$candidate
                break
              fi
            done
          fi
          if [ -z "$TAILSCALE" ] || [ ! -x "$TAILSCALE" ]; then
            printf '%s\n' 'brama-funnel: Tailscale CLI is unavailable on this host' >&2
            exit 69
          fi

          STADO=${STADO_BIN:-$(command -v stado || true)}
          if [ -z "$STADO" ]; then
            for candidate in \
              "$HOME/.stado/bin/stado" \
              /Users/charles/.stado/bin/stado \
              /usr/local/bin/stado \
              /opt/homebrew/bin/stado
            do
              if [ -x "$candidate" ]; then
                STADO=$candidate
                break
              fi
            done
          fi
          if [ -z "$STADO" ] || [ ! -x "$STADO" ]; then
            printf '%s\n' 'brama-funnel: Stado CLI is unavailable on this host' >&2
            exit 69
          fi

          directory=$("$STADO" service directory endpoint brama --json)
          ORIGIN=$(
            printf '%s\n' "$directory" |
              /usr/bin/python3 -c '
          import json
          import sys
          from urllib.parse import urlsplit

          entry = json.load(sys.stdin)
          url = entry.get("url")
          parsed = urlsplit(url) if isinstance(url, str) else None
          valid = (
              entry.get("service") == "brama"
              and entry.get("target") == entry.get("active_host")
              and parsed is not None
              and parsed.scheme == "http"
              and parsed.hostname == "127.0.0.1"
              and parsed.port is not None
              and parsed.path in ("", "/")
              and not parsed.query
              and not parsed.fragment
              and parsed.username is None
              and parsed.password is None
          )
          if not valid:
              raise SystemExit("brama-funnel: Stado did not declare a local Brama HTTP origin on this host")
          print(url.rstrip("/"))
          '
          )

          PORT=443
          "$TAILSCALE" funnel --bg --https="$PORT" --set-path "/" "$ORIGIN" >/dev/null
          status=$("$TAILSCALE" funnel status --json 2>/dev/null || true)
          if printf '%s\n' "$status" |
            FUNNEL_ORIGIN="$ORIGIN" FUNNEL_PORT="$PORT" /usr/bin/python3 -c '
          import json
          import os
          import sys

          document = json.load(sys.stdin)
          origin = os.environ["FUNNEL_ORIGIN"]
          port = os.environ["FUNNEL_PORT"]
          web = document.get("Web", {})
          matches = [
              value.get("Handlers", {}).get("/", {}).get("Proxy")
              for key, value in web.items()
              if key.rsplit(":", 1)[-1] == port
          ]
          allowed = any(
              key.rsplit(":", 1)[-1] == port and value is True
              for key, value in document.get("AllowFunnel", {}).items()
          )
          if matches != [origin] or not allowed:
              raise SystemExit(1)
          '
          then
            printf '%s\n' "brama-funnel: published declared origin $ORIGIN at HTTPS $PORT path /"
          else
            printf '%s\n' "$status" >&2
            printf '%s\n' 'brama-funnel: declared-origin postcondition failed' >&2
            exit 1
          fi

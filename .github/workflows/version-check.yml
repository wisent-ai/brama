name: version-check

# Refuse a change whose declared version disagrees with what it did to Brama's public
# contract. That contract is the command list `bin/brama` advertises, because the thing
# `.github/workflows/release.yml` publishes to GitHub Releases is a runtime bundle
# other machines invoke by command name -- and `brama mcp` reports the declared version
# back over MCP `initialize`, so a wrong number is externally observable.
#
# The rule itself lives in one place for the whole fleet and is NOT copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two things
# this repository alone knows: its surface, and the version it declares.
#
# The baseline is the committed released-surface.json and is never regenerated here; only
# the candidate is recomputed. A check that rebuilt both sides would always agree with
# itself and would gate nothing.
#
# A successful push to main tags the version already declared in Cargo.toml.
# The existing v* release workflow remains the sole artifact publisher.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust-gates:
    uses: wisent-ai/quality-control/.github/workflows/rust-gates.yml@0425f5bb426cb6205dc7ebedc2083d72928a10e5
    secrets:
      repository_token: ${{ secrets.ECHO_WEB_REPOSITORY_TOKEN }}

  contract:
    uses: wisent-ai/quality-control/.github/workflows/rust-autoversion.yml@2de57851b29b57da01fff370817a45ad121c93bc
    with:
      manifest: Cargo.toml
      baseline: released-surface.json
      surface-command: python3 scripts/surface.py

  baseline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the baseline agrees with GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$(jq -er '.source | split(" ") | first | select(length > 0)' released-surface.json)"
          case "$marker" in
            github-release:*|git-archive:*|head:*) ;;
            *)
              echo "::error::unknown baseline marker: $marker"
              false
              ;;
          esac

          : "${RUNNER_TEMP:=$(mktemp -d)}"
          python3 scripts/baseline.py > "$RUNNER_TEMP/best.json"
          best="$(jq -er '.source | split(" ") | first | select(length > 0)' "$RUNNER_TEMP/best.json")"

          if [ "${marker%%:*}" = head ]; then
            have="${marker%%:*}"
            want="${best%%:*}"
          else
            have="$marker"
            want="$best"
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::The baseline is $have, but $want is the best complete release."
            echo "::error::Regenerate it with: python3 scripts/baseline.py --write"
            false
          fi
          echo "Baseline $have matches the independent GitHub release channel."

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-gates, contract, baseline]
    permissions:
      contents: write
    uses: wisent-ai/quality-control/.github/workflows/tag-on-manifest-bump.yml@897485548846d7dfe38832b6b9a38212cdd1685a
    with:
      manifest: Cargo.toml

name: version-check

# Refuse a change whose declared version disagrees with what it did to Brama's public
# contract. That contract is the command list `bin/brama` advertises, because the thing
# `.github/workflows/release.yml` publishes to GitHub Releases is a runtime bundle
# other machines invoke by command name -- and `brama mcp` reports the declared version
# back over MCP `initialize`, so a wrong number is externally observable.
#
# The rule is AutoVersion's (https://github.com/lbartoszcze/AutoVersion, SPEC v0.1.0),
# kept as one small port per consumer and held identical by the shared fixtures. Brama's
# port is `brama version-gate`, carried by the candidate binary: this workflow first runs
# AutoVersion's FIXTURES.md against it (`conformance`), then `contract` compares the
# surface this binary advertises with the committed released-surface.json. A declared
# version may run ahead of the required one only over coordinates earlier commits on
# this branch declared, since the Stado release plane never reuses a coordinate.
#
# The baseline is the committed released-surface.json and is never regenerated here; only
# the candidate is recomputed. A check that rebuilt both sides would always agree with
# itself and would gate nothing. `brama version-gate baseline` checks that file against
# the channel that published it, which for Brama is the Stado release plane.
#
# A successful push to main tags the version already declared in Cargo.toml.
# The existing v* release workflow remains the sole artifact publisher.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust-gates:
    uses: wisent-ai/quality-control/.github/workflows/rust-gates.yml@5de58cebb190c04e752337da7c96244311d0a75c
    secrets:
      repository_token: ${{ secrets.ECHO_WEB_REPOSITORY_TOKEN }}

  version-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize pinned private source dependency
        env:
          ECHO_WEB_REPOSITORY_TOKEN: ${{ secrets.ECHO_WEB_REPOSITORY_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${ECHO_WEB_REPOSITORY_TOKEN}@github.com/".insteadOf \
            https://github.com/
          printf '%s\n' 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the candidate binary
        run: cargo build --locked --release --bin brama

      - name: Prove this binary's versioning rule against the shared fixtures
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/autoversion-fixtures.md" \
            https://raw.githubusercontent.com/lbartoszcze/AutoVersion/v0.1.0/FIXTURES.md
          target/release/brama version-gate conformance \
            --fixtures "$RUNNER_TEMP/autoversion-fixtures.md"

      - name: Enforce released surface and committed manifest version
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- Cargo.toml
          target/release/brama version-gate contract --self-check

      - name: Assert the baseline agrees with the channel that published it
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: target/release/brama version-gate baseline

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-gates, version-gate]
    permissions:
      contents: write
      actions: write
    uses: wisent-ai/quality-control/.github/workflows/tag-on-manifest-bump.yml@b3e0ed475860f77960f70c66527e4598dfa1c5b9
    with:
      manifest: Cargo.toml
      release-workflow: release.yml

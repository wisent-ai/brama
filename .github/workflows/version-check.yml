name: version-check

# Refuse a change whose declared version disagrees with what it did to Brama's public
# contract. That contract is the command list `bin/brama` advertises, because the thing
# `.github/workflows/release.yml` publishes to GitHub Releases is a runtime bundle
# other machines invoke by command name -- and `brama mcp` reports the declared version
# back over MCP `initialize`, so a wrong number is externally observable.
#
# The rule itself lives in one place for the whole fleet and is NOT copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the two things
# this repository alone knows: its surface, and the version it declares.
#
# The baseline is the committed released-surface.json and is never regenerated here; only
# the candidate is recomputed. A check that rebuilt both sides would always agree with
# itself and would gate nothing.
#
# `scripts/check-baseline.py` checks that file against the channel that published it.
# Brama's releases are published by the Stado release plane, which is what every host
# installs; GitHub Releases are a second, secondary channel and stalled at v0.2.53 when
# the tag job below stopped running. Asserting the baseline had to be the newest GitHub
# release therefore refused every commit for twenty-two versions, and this job's failure
# is what kept the tag job from running at all.
#
# A successful push to main tags the version already declared in Cargo.toml.
# The existing v* release workflow remains the sole artifact publisher.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust-gates:
    uses: wisent-ai/quality-control/.github/workflows/rust-gates.yml@5de58cebb190c04e752337da7c96244311d0a75c
    secrets:
      repository_token: ${{ secrets.ECHO_WEB_REPOSITORY_TOKEN }}

  contract:
    uses: wisent-ai/quality-control/.github/workflows/rust-autoversion.yml@2de57851b29b57da01fff370817a45ad121c93bc
    with:
      manifest: Cargo.toml
      baseline: released-surface.json
      surface-command: python3 scripts/surface.py

  baseline:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the baseline agrees with the channel that published it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/check-baseline.py

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-gates, contract, baseline]
    permissions:
      contents: write
      actions: write
    uses: wisent-ai/quality-control/.github/workflows/tag-on-manifest-bump.yml@b3e0ed475860f77960f70c66527e4598dfa1c5b9
    with:
      manifest: Cargo.toml
      release-workflow: release.yml

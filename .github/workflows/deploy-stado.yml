name: deploy-stado

# Publishes an immutable Brama runtime bundle to Stado, stages it on the
# registered service host, and asks Stado to install the long-lived service.
# The runner MUST be the Linux registry host named by STADO_SERVICE_HOST; this
# is what makes target-local staging explicit instead of smuggling in ssh or a
# provider-specific deployment API.
#
# Repository variables:
#   STADO_API_URL
#   STADO_CLI_RELEASE_VERSION
#   STADO_CLI_RELEASE_PLATFORM
#   STADO_CLI_RELEASE_SHA256
#   STADO_SERVICE_HOST
#   STADO_SERVICE_RELEASE_ROOT
#   SKARBIEC_ROUTER_RELEASE_URI
#   SKARBIEC_ROUTER_RELEASE_SHA256
# Runner prerequisites:
#   a provisioned Stado CLI that supports `storage url`
#   Docker with access to the digest-pinned builder inputs
#   Node for deterministic capability-config generation
#   a scoped Skarbiec grant for only `brama-release-publisher/token`
# The runtime launcher uses a separate `BRAMA_SKARBIEC_STADO_CONFIG` whose grant
# can read only `brama-service/gpg_private_key`. Neither secret is copied to
# GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-stado-brama
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, stado-service]
    permissions:
      contents: read
    env:
      STADO_API_URL: ${{ vars.STADO_API_URL }}
      STADO_CLI_RELEASE_VERSION: ${{ vars.STADO_CLI_RELEASE_VERSION }}
      STADO_CLI_RELEASE_PLATFORM: ${{ vars.STADO_CLI_RELEASE_PLATFORM }}
      STADO_CLI_RELEASE_SHA256: ${{ vars.STADO_CLI_RELEASE_SHA256 }}
      STADO_SERVICE_HOST: ${{ vars.STADO_SERVICE_HOST }}
      STADO_SERVICE_RELEASE_ROOT: ${{ vars.STADO_SERVICE_RELEASE_ROOT }}
      SKARBIEC_ROUTER_RELEASE_URI: ${{ vars.SKARBIEC_ROUTER_RELEASE_URI }}
      SKARBIEC_ROUTER_RELEASE_SHA256: ${{ vars.SKARBIEC_ROUTER_RELEASE_SHA256 }}
      STADO_RELEASE_VERSION: ${{ github.sha }}
      BRAMA_API_HOST: ${{ vars.BRAMA_API_HOST }}
      BRAMA_PORT: ${{ vars.BRAMA_PORT }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Stado CLI from its release channel
        shell: bash
        run: |
          set -euo pipefail
          : "${STADO_API_URL:?configure STADO_API_URL}"
          : "${STADO_CLI_RELEASE_VERSION:?configure STADO_CLI_RELEASE_VERSION}"
          : "${STADO_CLI_RELEASE_PLATFORM:?configure STADO_CLI_RELEASE_PLATFORM}"
          : "${STADO_CLI_RELEASE_SHA256:?configure STADO_CLI_RELEASE_SHA256}"
          for component in "$STADO_CLI_RELEASE_VERSION" "$STADO_CLI_RELEASE_PLATFORM"; do
            case "$component" in
              .|..|*[![:alnum:]._-]*) echo "invalid Stado CLI release component"; false ;;
            esac
          done
          STADO_BOOTSTRAP_BIN="${STADO_BOOTSTRAP_BIN:-stado}"
          release_uri="stado://releases/stado/$STADO_CLI_RELEASE_VERSION/$STADO_CLI_RELEASE_PLATFORM/stado"
          release_url="$("$STADO_BOOTSTRAP_BIN" storage url "$release_uri")"
          case "$release_url" in
            https://*/api/release/object\?uri=*) ;;
            *) echo "Stado rendered an invalid CLI release URL"; false ;;
          esac
          install -d -m u=rwx,go= "$RUNNER_TEMP/stado-bin"
          curl --fail --silent --show-error --location \
            "$release_url" \
            --output "$RUNNER_TEMP/stado-bin/stado"
          printf '%s  %s\n' \
            "$STADO_CLI_RELEASE_SHA256" \
            "$RUNNER_TEMP/stado-bin/stado" | sha256sum --check -
          chmod u=rwx,go= "$RUNNER_TEMP/stado-bin/stado"
          printf 'STADO_BIN=%s\n' "$RUNNER_TEMP/stado-bin/stado" >>"$GITHUB_ENV"

      - name: Materialize pinned Skarbiec router
        shell: bash
        run: |
          set -euo pipefail
          : "${SKARBIEC_ROUTER_RELEASE_URI:?configure SKARBIEC_ROUTER_RELEASE_URI}"
          : "${SKARBIEC_ROUTER_RELEASE_SHA256:?configure SKARBIEC_ROUTER_RELEASE_SHA256}"
          case "$SKARBIEC_ROUTER_RELEASE_URI" in
            stado://releases/skarbiec/*/linux-*/skarbiec-entitlements-router) ;;
            *) echo "SKARBIEC_ROUTER_RELEASE_URI must use the dedicated immutable Skarbiec product prefix"; false ;;
          esac
          "$STADO_BIN" storage get \
            "$SKARBIEC_ROUTER_RELEASE_URI" \
            "$RUNNER_TEMP/skarbiec-entitlements-router"
          printf '%s  %s\n' \
            "$SKARBIEC_ROUTER_RELEASE_SHA256" \
            "$RUNNER_TEMP/skarbiec-entitlements-router" | sha256sum --check -
          chmod u=rwx,go= "$RUNNER_TEMP/skarbiec-entitlements-router"

      - name: Build Brama in the pinned builder image
        shell: bash
        run: |
          set -euo pipefail
          product_version="$(python3 scripts/baseline.py --declared-version)"
          printf 'BRAMA_PRODUCT_VERSION=%s\n' "$product_version" >>"$GITHUB_ENV"
          platform="linux-$(uname -m)"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          image="brama-release-builder:${GITHUB_SHA}"
          docker build --pull --target builder --tag "$image" \
            --build-arg BRAMA_SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg BRAMA_BUILD_PLATFORM="$platform" \
            --build-arg BRAMA_BUILD_TIMESTAMP="$built_at" \
            .
          printf 'BRAMA_BUILD_PLATFORM=%s\n' "$platform" >>"$GITHUB_ENV"
          printf 'BRAMA_BUILD_TIMESTAMP=%s\n' "$built_at" >>"$GITHUB_ENV"
          container="$(docker create "$image")"
          trap 'docker rm --force "$container" >/dev/null' EXIT
          mkdir -p target/release
          docker cp "$container:/build/target/release/brama" target/release/brama
          chmod u=rwx,go= target/release/brama

      - name: Package immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          platform="$BRAMA_BUILD_PLATFORM"
          archive="$RUNNER_TEMP/brama-${STADO_RELEASE_VERSION}-${platform}.tar.gz"
          BRAMA_BINARY="$GITHUB_WORKSPACE/target/release/brama" \
          BRAMA_SOURCE_REVISION="$GITHUB_SHA" \
          BRAMA_PRODUCT_VERSION="$BRAMA_PRODUCT_VERSION" \
          BRAMA_BUILD_TIMESTAMP="$BRAMA_BUILD_TIMESTAMP" \
          BRAMA_BUILDER_IDENTITY="$RUNNER_NAME" \
          SKARBIEC_ROUTER_BINARY="$RUNNER_TEMP/skarbiec-entitlements-router" \
          STADO_RELEASE_PLATFORM="$platform" \
          STADO_RELEASE_ARCHIVE="$archive" \
            scripts/package-stado-release.sh
          printf 'STADO_RELEASE_PLATFORM=%s\n' "$platform" >>"$GITHUB_ENV"
          printf 'STADO_RELEASE_ARCHIVE=%s\n' "$archive" >>"$GITHUB_ENV"
          printf 'STADO_RELEASE_SHA256=%s\n' "$archive.sha256" >>"$GITHUB_ENV"
          printf 'STADO_RELEASE_PROVENANCE=%s\n' "$archive.provenance.json" >>"$GITHUB_ENV"

      - name: Publish, stage, and deploy through Stado
        shell: bash
        run: |
          set -euo pipefail
          STADO_API_TOKEN="$(scripts/read-stado-release-publisher-token.sh)"
          echo "::add-mask::$STADO_API_TOKEN"
          export STADO_API_TOKEN
          scripts/deploy-stado-service.sh

      - name: Reload host-local HTTPS ingress
        shell: bash
        run: |
          set -euo pipefail
          : "${BRAMA_API_HOST:?configure BRAMA_API_HOST}"
          : "${BRAMA_PORT:?configure BRAMA_PORT}"
          if ! command -v caddy >/dev/null; then
            echo "::error::Caddy is not installed on the registered Brama host."
            false
          fi
          BRAMA_UPSTREAM="localhost:${BRAMA_PORT}"
          export BRAMA_UPSTREAM
          caddy reload --config "$GITHUB_WORKSPACE/deploy/Caddyfile" --adapter caddyfile

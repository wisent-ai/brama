name: release-control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact Stado release operation
        required: true
        type: choice
        options:
          - submit-candidate
          - submit-stable
          - promote-candidate
          - promote-stable
          - status
          - rollback
      runner_label:
        description: Label of the Stado-selected macOS ARM64 control runner
        required: true
        type: string
      version:
        description: Exact SemVer for submit or promote; leave empty for status or rollback
        required: false
        type: string
      source_directory:
        description: Existing Brama checkout on the selected runner; submit actions only
        required: false
        type: string
      source_revision:
        description: Full committed source SHA; submit actions only
        required: false
        type: string

concurrency:
  group: brama-release-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-control:
    runs-on: [self-hosted, macOS, ARM64, "${{ inputs.runner_label }}"]
    environment: ${{ (inputs.action == 'submit-stable' || inputs.action == 'promote-stable' || inputs.action == 'rollback') && 'release-production' || inputs.action == 'submit-candidate' && 'release-qualification' || 'release-operations' }}
    env:
      GIT_TERMINAL_PROMPT: "0"
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_BIN: ${{ vars.STADO_BIN_PATH }}
      RELEASE_ACTION: ${{ inputs.action }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: ${{ inputs.source_directory }}
      RELEASE_COMMIT: ${{ inputs.source_revision }}
    steps:
      - name: Validate explicitly configured Stado client
        shell: bash
        run: |
          set -euo pipefail
          : "${STADO_CONFIG:?Set STADO_CONFIG_PATH in the selected GitHub environment}"
          : "${STADO_BIN:?Set STADO_BIN_PATH in the selected GitHub environment}"
          if [[ "$STADO_CONFIG" != /* || ! -f "$STADO_CONFIG" || ! -r "$STADO_CONFIG" ]]; then
            printf '%s\n' 'STADO_CONFIG_PATH must name a readable absolute configuration file on this runner' >&2
            exit 66
          fi
          if [[ "$STADO_BIN" != /* || ! -f "$STADO_BIN" || ! -x "$STADO_BIN" ]]; then
            printf '%s\n' 'STADO_BIN_PATH must name an executable absolute Stado binary on this runner' >&2
            exit 69
          fi
          "$STADO_BIN" --version
      - name: Execute the requested Stado operation
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_ACTION" in
            submit-candidate|submit-stable)
              : "${RELEASE_VERSION:?submit requires version}"
              : "${RELEASE_SOURCE:?submit requires source_directory}"
              if [[ "$RELEASE_SOURCE" != /* || ! -d "$RELEASE_SOURCE" ]]; then
                printf '%s\n' 'source_directory must name an existing absolute checkout path on this runner' >&2
                exit 66
              fi
              if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                printf '%s\n' 'submit requires source_revision as 40 lowercase hexadecimal characters' >&2
                exit 64
              fi
              source_product="$(git -C "$RELEASE_SOURCE" show "$RELEASE_COMMIT:.wisent-release.json" | jq -er '.product')"
              if [[ "$source_product" != brama ]]; then
                printf 'source commit %s declares product %s, not brama\n' "$RELEASE_COMMIT" "$source_product" >&2
                exit 64
              fi
              "$STADO_BIN" release submit --source "$RELEASE_SOURCE" --commit "$RELEASE_COMMIT" \
                --version "$RELEASE_VERSION" --channel "${RELEASE_ACTION#submit-}" --json
              ;;
            promote-candidate|promote-stable)
              : "${RELEASE_VERSION:?promote requires version}"
              if [[ -n "$RELEASE_SOURCE" || -n "$RELEASE_COMMIT" ]]; then
                printf '%s\n' 'promote consumes a published version; source inputs are not accepted' >&2
                exit 64
              fi
              "$STADO_BIN" release promote brama "$RELEASE_VERSION" \
                --channel "${RELEASE_ACTION#promote-}" --json
              ;;
            status|rollback)
              if [[ -n "$RELEASE_VERSION" || -n "$RELEASE_SOURCE" || -n "$RELEASE_COMMIT" ]]; then
                printf '%s\n' 'status and rollback do not accept version or source inputs' >&2
                exit 64
              fi
              "$STADO_BIN" release "$RELEASE_ACTION" brama --json
              ;;
            *)
              printf 'unsupported release action: %s\n' "$RELEASE_ACTION" >&2
              exit 64
              ;;
          esac

name: release-control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Exact release-control operation
        required: true
        type: choice
        options:
          - prepare
          - submit-stable
          - promote-candidate
          - promote-stable
          - activate-stable
          - reconcile-origin
          - status
          - rollback
      version:
        description: Exact SemVer without the v prefix
        required: true
        type: string
      rollback_compatible_with:
        description: Previous SemVer accepted by this release
        required: false
        type: string

concurrency:
  group: brama-release-control
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-control:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    environment: ${{ inputs.action == 'prepare' && 'release-qualification' || inputs.action == 'promote-stable' && 'release-production' || 'release-operations' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: brama-source
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.STADO_REPOSITORY }}
          ref: ${{ vars.STADO_RELEASE_CLI_REVISION }}
          path: stado-source
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare ephemeral release workspace
        env:
          BRAMA_RELEASE_SIGNING_KEY_B64: ${{ secrets.BRAMA_RELEASE_SIGNING_KEY_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release-control"
          if [ "${{ inputs.action }}" = prepare ]; then
            : "${BRAMA_RELEASE_SIGNING_KEY_B64:?BRAMA_RELEASE_SIGNING_KEY_B64 is required for prepare}"
            printf '%s' "$BRAMA_RELEASE_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/release-control/brama-release.pk8"
          fi
      - name: Build pinned Stado release client
        working-directory: stado-source/stado-rs
        run: cargo build --locked --release --bin stado
      - name: Build and publish through the Stado release pipeline
        if: inputs.action == 'submit-stable'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
          STADO_BIN: ${{ github.workspace }}/stado-source/stado-rs/target/release/stado
        run: |
          scripts/run-retryable-stado.sh "$STADO_BIN" release submit \
            --source "$GITHUB_WORKSPACE/brama-source" \
            --version "${{ inputs.version }}" \
            --channel stable \
            --json
      - name: Download exact GitHub release bytes
        if: inputs.action == 'prepare'
        working-directory: brama-source
        env:
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}
        run: |
          for platform in linux-amd64 darwin-arm64; do
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "brama-v${{ inputs.version }}-$platform.tar.gz" \
              "$RELEASE_BASE_URL/brama-v${{ inputs.version }}-$platform.tar.gz"
          done
      - name: Publish signed qualified candidate to Stado
        if: inputs.action == 'prepare'
        working-directory: brama-source
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
          STADO_BIN: ${{ github.workspace }}/stado-source/stado-rs/target/release/stado
          RECEIPT_DIR: ${{ runner.temp }}/release-control
        run: |
          source_revision="$(git rev-parse HEAD)"
          source_archive="$RUNNER_TEMP/release-control/brama-source.tar.gz"
          git archive --format=tar HEAD | gzip -9 -n > "$source_archive"
          source_sha256="$(openssl dgst -sha256 "$source_archive")"
          source_sha256="${source_sha256##* }"
          pipeline_manifest_sha256="$(openssl dgst -sha256 .wisent-release.json)"
          pipeline_manifest_sha256="${pipeline_manifest_sha256##* }"
          builder="github-actions/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          compatibility=()
          if [ -n "${{ inputs.rollback_compatible_with }}" ]; then
            compatibility=(--rollback-compatible-with "${{ inputs.rollback_compatible_with }}")
          fi
          for platform in linux-amd64 darwin-arm64; do
            archive="brama-v${{ inputs.version }}-$platform.tar.gz"
            artifact_sha256="$(openssl dgst -sha256 "$archive")"
            artifact_sha256="${artifact_sha256##* }"
            artifact_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
            qualification="$RECEIPT_DIR/qualification-$platform.json"
            jq -n \
              --arg product brama \
              --arg version "${{ inputs.version }}" \
              --arg platform "$platform" \
              --arg builder "$builder" \
              --arg source_commit "$source_revision" \
              --arg source_sha256 "$source_sha256" \
              --arg manifest_sha256 "$pipeline_manifest_sha256" \
              --arg artifact_sha256 "$artifact_sha256" \
              --arg artifact_path "$archive" \
              --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson artifact_bytes "$artifact_bytes" \
              '{schema_version:1,run_id:env.GITHUB_RUN_ID,job_id:env.GITHUB_JOB,
                product:$product,version:$version,platform:$platform,builder:$builder,
                source_commit:$source_commit,source_sha256:$source_sha256,
                manifest_sha256:$manifest_sha256,inputs:{},secret_env:{},
                quality:[{name:"github-release-quality",argv:["release.yml"],status:"passed",exit_code:0}],
                build:{name:"github-release-build",argv:["cargo","build","--release"],status:"passed",exit_code:0},
                status:"passed",artifact:{sha256:$artifact_sha256,bytes:$artifact_bytes,path:$artifact_path},
                completed_at:$completed_at,failure:null}' > "$qualification"
            scripts/run-retryable-stado.sh "$STADO_BIN" release prepare brama "${{ inputs.version }}" "$platform" \
              --archive "$archive" \
              --source-revision "$source_revision" \
              --binary bin/brama \
              --launcher bin/start-with-skarbiec \
              --signing-key-file "$RUNNER_TEMP/release-control/brama-release.pk8" \
              --key-id brama-release-2026-08 \
              --source-sha256 "$source_sha256" \
              --pipeline-manifest-sha256 "$pipeline_manifest_sha256" \
              --qualification "$qualification" \
              --minimum-stado-version 0.5.1 \
              "${compatibility[@]}" \
              --builder "$builder" \
              --json
          done
      - name: Promote candidate routing
        if: inputs.action == 'promote-candidate'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
        run: scripts/run-retryable-stado.sh stado-source/stado-rs/target/release/stado release promote brama "${{ inputs.version }}" --channel candidate --json
      - name: Promote stable routing
        if: inputs.action == 'promote-stable'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
        run: |
          scripts/run-retryable-stado.sh stado-source/stado-rs/target/release/stado release promote brama "${{ inputs.version }}" --channel stable --json
          stado-source/stado-rs/scripts/reconcile-release-funnel-host.sh
      - name: Reconcile public release origin only
        if: inputs.action == 'reconcile-origin'
        run: stado-source/stado-rs/scripts/reconcile-release-funnel-host.sh
      - name: Activate stable release with unified observed state
        if: inputs.action == 'activate-stable'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
        run: |
          scripts/run-retryable-stado.sh stado-source/stado-rs/target/release/stado service release \
            com.wisent.always-on.brama \
            --host charless-mac-mini \
            --product brama \
            --version "${{ inputs.version }}" \
            --readiness-url http://127.0.0.1:8080/health \
            --readiness-timeout-seconds 90 \
            --json
      - name: Read rollout status
        if: inputs.action == 'status'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
        run: scripts/run-retryable-stado.sh stado-source/stado-rs/target/release/stado release status brama --json
      - name: Request rollback
        if: inputs.action == 'rollback'
        env:
          STADO_CONFIG: /Users/charles/.config/stado/config.json
        run: scripts/run-retryable-stado.sh stado-source/stado-rs/target/release/stado release rollback brama --json
      - name: Remove ephemeral release credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-control"

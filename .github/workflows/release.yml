name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            architecture: x86_64
          - os: macos-latest
            platform: darwin-arm64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/skarbiec
          ref: ${{ vars.SKARBIEC_RELEASE_REVISION }}
          path: skarbiec-source
      - name: Authorize pinned private source dependency
        env:
          ECHO_WEB_REPOSITORY_TOKEN: ${{ secrets.ECHO_WEB_REPOSITORY_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${ECHO_WEB_REPOSITORY_TOKEN}@github.com/".insteadOf \
            https://github.com/
          printf '%s\n' 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record build timestamp
        run: printf '%s\n' "BRAMA_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build tagged artifact once
        env:
          BRAMA_SOURCE_REVISION: ${{ github.sha }}
          BRAMA_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --locked --release --bin brama
          cargo build --locked --release --bin skarbiec --manifest-path skarbiec-source/Cargo.toml
      - name: Publish immutable tagged artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_architecture="$(uname -m)"
          if [ "$actual_architecture" != "${{ matrix.architecture }}" ]; then
            printf '%s\n' "release runner architecture $actual_architecture does not match ${{ matrix.architecture }}"
            false
          fi
          archive="brama-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz"
          checksum="${archive}.sha256"
          stage="$(mktemp -d)"
          mkdir -p "$stage/bin" "$stage/libexec" "$stage/etc/brama-skarbiec"
          cp target/release/brama "$stage/bin/brama"
          cp skarbiec-source/target/release/skarbiec "$stage/bin/skarbiec-entitlements-router"
          cp scripts/start-with-skarbiec.sh "$stage/bin/start-with-skarbiec"
          cp scripts/provision-skarbiec-trust.sh "$stage/bin/provision-skarbiec-trust"
          cp scripts/skarbiec-subscriptions.json "$stage/etc/brama-skarbiec/subscriptions.json"
          cp scripts/skarbiec-recipient-public-keys.asc "$stage/etc/brama-skarbiec/recipient-public-keys.asc"
          cp LICENSE "$stage/"
          # The trust material is NOT generated here. It pins the absolute path
          # and SHA-256 of the binary allowed to redeem a capability, which a
          # build machine cannot know, and generating it here would put the same
          # workload proof key in every copy of this archive. The operator runs
          # bin/provision-skarbiec-trust once per installation instead, so the
          # generator ships as data rather than being executed now.
          cp scripts/generate-skarbiec-config.mjs "$stage/libexec/generate-skarbiec-config.mjs"
          chmod 0755 \
            "$stage/bin/brama" \
            "$stage/bin/skarbiec-entitlements-router" \
            "$stage/bin/start-with-skarbiec" \
            "$stage/bin/provision-skarbiec-trust"
          skarbiec_revision="$(git -C skarbiec-source rev-parse HEAD)"
          jq -n \
            --arg product brama \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg source_revision "$GITHUB_SHA" \
            --arg skarbiec_revision "$skarbiec_revision" \
            --arg platform "${{ matrix.platform }}" \
            --arg built_at "$BRAMA_BUILD_TIMESTAMP" \
            --arg builder "github-actions/${{ runner.os }}-${{ runner.arch }}" \
            '{product: $product, version: $version, source_revision: $source_revision, dependencies: {skarbiec: $skarbiec_revision}, platform: $platform, built_at: $built_at, builder: $builder}' \
            > "$stage/provenance.json"
          tar -czf "$archive" -C "$stage" .
          openssl dgst -sha256 -r "$archive" > "$checksum"
          gh release view "$GITHUB_REF_NAME" >/dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum"


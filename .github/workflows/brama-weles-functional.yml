name: brama-weles-functional

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brama-weles-functional
  cancel-in-progress: false

jobs:
  real-sign-in:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 45
    steps:
      - name: Check out Brama
        uses: actions/checkout@v4
      - name: Check out pinned Probierz
        uses: actions/checkout@v4
        with:
          repository: wisent-ai/probierz
          ref: 521d02516a8f7ccc62179b4c6a0e76e56085d377
          path: probierz-source
      - name: Put Homebrew on PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned Probierz dependencies
        working-directory: probierz-source
        run: npm ci
      - name: Run all real Brama to Weles sign-ins through Probierz
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/probierz-source/agent/cli.mjs" run tui \
            --app brama \
            --record \
            --spec "$GITHUB_WORKSPACE/tests/subscriptions/brama-weles-real.spec.mjs" \
            --timeout 2400000

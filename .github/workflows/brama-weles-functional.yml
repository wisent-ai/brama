name: brama-weles-functional

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brama-weles-functional
  cancel-in-progress: false

jobs:
  real-sign-in:
    runs-on: [self-hosted, macOS, ARM64, stado-release]
    timeout-minutes: 45
    steps:
      - name: Check out Brama
        uses: actions/checkout@v4
      - name: Check out pinned Probierz
        uses: actions/checkout@v4
        with:
          repository: wisent-ai/probierz
          ref: 521d02516a8f7ccc62179b4c6a0e76e56085d377
          path: probierz-source
      - name: Put Homebrew on PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the exact Brama binary under test
        run: cargo build --bin brama
      - name: Install the pinned Probierz dependencies
        working-directory: probierz-source
        run: npm ci
      - name: Register the Brama functional surface
        run: |
          mkdir -p probierz-source/apps/brama
          cp tests/subscriptions/probierz.yaml probierz-source/apps/brama/probierz.yaml
          cp tests/subscriptions/brama-weles-real.spec.mjs probierz-source/packages/tui/specs/brama-weles-real.spec.mjs
      - name: Run all real Brama to Weles sign-ins through Probierz
        shell: bash
        env:
          BRAMA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/probierz-source/agent/cli.mjs" run tui \
            --app brama \
            --record \
            --spec "$GITHUB_WORKSPACE/tests/subscriptions/brama-weles-real.spec.mjs" \
            --timeout 2400000
      - name: Retain the complete Probierz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brama-weles-probierz-${{ github.run_id }}
          path: probierz-source/test-results/brama/tui
          if-no-files-found: error
          retention-days: 30

name: deploy-cloudrun

# Auto-deploy model-router to Cloud Run on every push to main. Source-deploy
# (--source .) builds from the repo Dockerfile via Cloud Build and preserves
# the service's existing env/secrets, so no credentials are handled in CI.
#
# One-time activation (owner, in repo Settings, not a per-deploy step):
#   - secret  GCP_SA_KEY   : JSON key for a deployer service account with
#                            roles/run.admin + roles/cloudbuild.builds.editor
#                            + roles/iam.serviceAccountUser (+ storage for build)
#   - variable GCP_PROJECT  : the Cloud Run project id
#   - variable GCP_REGION   : region (default us-central1 if unset)
#   - variable RUN_SERVICE  : Cloud Run service name (default model-router)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source build)
        run: |
          gcloud run deploy "${RUN_SERVICE:-model-router}" \
            --source . \
            --project "$GCP_PROJECT" \
            --region "${GCP_REGION:-us-central1}" \
            --quiet
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUN_SERVICE: ${{ vars.RUN_SERVICE }}
